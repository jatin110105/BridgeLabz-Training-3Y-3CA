<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Select Your Travel Preferences</h1>

  <form action="#" method="post">

    <p>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
      </select>
    </p>

    <p>
      <label for="state">State:</label>
      <select id="state" name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="rj">Rajasthan</option>
        <option value="mh">Maharashtra</option>
      </select>
    </p>

    <p>
      <label for="city">City:</label>
      <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="lucknow">Lucknow</option>
      </select>
    </p>

    <p>
      <label for="place">Favorite Tourist Place:</label>
      <select id="place" name="place">
        <option value="taj" selected>Taj Mahal</option>
        <option value="krishna">Krishna Janmabhoomi</option>
        <option value="fort">Agra Fort</option>
      </select>
    </p>

  </form>

  <!-- Summary of the pre-selected choices -->
  <p>
    <strong>Summary:</strong> I live in Mathura, Uttar Pradesh, India, and my favorite
    tourist place is the Taj Mahal.
  </p>
</body>
</html>
