<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q3.css">
</head>
<body>

<header class="bg-primary text-white text-center py-4">
  <h1>ShopEase Store</h1>
  <p class="mb-0">Best Products, Best Prices</p>
</header>

<main class="container my-5">
  <div class="row g-4">
    <div class="col-md-3 col-sm-6 col-12">
      <div class="card h-100 product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Headphones">
        <div class="card-body text-center">
          <h5 class="card-title">Wireless Headphones</h5>
          <p class="card-text fw-bold">$59.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 col-12">
      <div class="card h-100 product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Smartwatch">
        <div class="card-body text-center">
          <h5 class="card-title">Smart Watch</h5>
          <p class="card-text fw-bold">$99.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 col-12">
      <div class="card h-100 product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Camera">
        <div class="card-body text-center">
          <h5 class="card-title">Digital Camera</h5>
          <p class="card-text fw-bold">$249.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 col-12">
      <div class="card h-100 product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Speaker">
        <div class="card-body text-center">
          <h5 class="card-title">Bluetooth Speaker</h5>
          <p class="card-text fw-bold">$39.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2026 ShopEase</p>
</footer>

</body>
</html>
