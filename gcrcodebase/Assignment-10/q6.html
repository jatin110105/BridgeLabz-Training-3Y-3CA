<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q6.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-4">
  <h1>Notifications Dashboard</h1>
</header>

<main class="container my-5">
  <div class="card p-4 shadow-sm">
    <h4 class="mb-3">Recent Notifications</h4>

    <div class="alert alert-success" role="alert">
      New message received from Karan Kumar.
    </div>

    <div class="alert alert-info" role="alert">
      Tip: Complete your profile to unlock more features.
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      Warning: Your storage is almost full.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="bg-light border rounded p-4 mt-4">
      <h5>Summary</h5>
      <p class="mb-0">You have 3 new notifications and 1 pending warning that needs your attention.</p>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2026 Dashboard App</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
