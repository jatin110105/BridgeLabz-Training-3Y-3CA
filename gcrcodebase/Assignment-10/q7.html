<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q7.css">
</head>
<body class="bg-light">

<header class="bg-primary text-white text-center py-4">
  <h1>Task Tracker <span class="badge bg-danger">5 Pending</span></h1>
</header>

<main class="container my-5">
  <ul class="list-group shadow-sm">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish DevOps assignment
      <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Update portfolio website
      <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Read Bootstrap documentation
      <span class="badge bg-success">Low</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Prepare mid-term notes
      <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Fix bug in login form
      <span class="badge bg-warning text-dark">Medium</span>
    </li>
  </ul>

  <div class="text-center mt-4">
    <button class="btn btn-success">
      Completed <span class="badge bg-light text-dark ms-1">12</span>
    </button>
  </div>
</main>

<footer class="bg-primary text-white text-center py-3 mt-4">
  <p class="mb-0">&copy; 2026 Task Tracker App</p>
</footer>

</body>
</html>
