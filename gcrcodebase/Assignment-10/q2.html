<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jatin - Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<header class="text-center py-5 bg-white">
  <div class="container">
    <img src="https://placehold.co/150x150" class="img-fluid rounded-circle mb-3" alt="Profile Picture">
    <h1 class="fw-bold">Jatin Sharma</h1>
    <p class="text-muted fw-bold">Full-Stack Developer & Cloud Enthusiast</p>
    <div class="mt-4">
      <button class="btn btn-primary mx-2 px-4">Hire Me</button>
      <button class="btn btn-outline-secondary mx-2 px-4">Download CV</button>
    </div>
  </div>
</header>

<main class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow-sm">
        <h4 class="text-center mb-4">Contact Me</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Your Name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="3" placeholder="Your message"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-3 bg-white border-top mt-4">
  <p class="mb-0">&copy; 2026 Jatin Sharma</p>
</footer>

</body>
</html>
