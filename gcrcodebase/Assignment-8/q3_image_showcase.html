<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 - Image Showcase</title>
  <link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
    <p>Hover over an image to zoom and darken it.</p>
  </header>

  <main>
    <section class="gallery">
      <figure>
        <div class="img-wrap"><img src="images/img1.svg" alt="Sunset gradient scene"></div>
        <figcaption>Sunset Ridge</figcaption>
      </figure>
      <figure>
        <div class="img-wrap"><img src="images/img2.svg" alt="Lagoon gradient scene"></div>
        <figcaption>Blue Lagoon</figcaption>
      </figure>
      <figure>
        <div class="img-wrap"><img src="images/img3.svg" alt="Twilight gradient scene"></div>
        <figcaption>Twilight Hills</figcaption>
      </figure>
      <figure>
        <div class="img-wrap"><img src="images/img4.svg" alt="Bloom gradient scene"></div>
        <figcaption>Pink Bloom</figcaption>
      </figure>
      <figure>
        <div class="img-wrap"><img src="images/img5.svg" alt="Glacier gradient scene"></div>
        <figcaption>Glacier Peak</figcaption>
      </figure>
      <figure>
        <div class="img-wrap"><img src="images/img6.svg" alt="Mango gradient scene"></div>
        <figcaption>Mango Dunes</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Assignment 8 - Question 3</p>
  </footer>
</body>
</html>
