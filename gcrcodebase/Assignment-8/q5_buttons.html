<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Button Collection</title>
  <link rel="stylesheet" href="q5_buttons.css">
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
  </header>

  <main>
    <section class="button-row">
      <button type="button" class="btn btn-primary">Primary</button>
      <button type="button" class="btn btn-secondary">Secondary</button>
      <button type="button" class="btn btn-outline">Outline</button>
      <button type="button" class="btn btn-primary" disabled>Disabled</button>
    </section>

    <p class="note">Hover, press, and Tab to the buttons to see the hover, active, and focus states.
    The last button is disabled.</p>
  </main>

  <footer>
    <p>Assignment 8 - Question 5</p>
  </footer>
</body>
</html>
