<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Combined Effects</title>
  <link rel="stylesheet" href="q9_combined_effects.css">
</head>
<body>
  <header>
    <h1>Combined Effects</h1>
    <p>Pseudo-classes + transitions + transforms</p>
  </header>

  <main>
    <section class="examples">

      <article class="example">
        <button type="button" class="btn grow">Grow &amp; recolour</button>
        <p>:hover scales up and changes colour.</p>
      </article>

      <article class="example">
        <button type="button" class="btn lift">Lift</button>
        <p>:hover moves up, :active pushes down.</p>
      </article>

      <article class="example">
        <div class="card" tabindex="0">Rotating card</div>
        <p>:hover / :focus tilts the card.</p>
      </article>

      <article class="example">
        <a href="#" class="btn pill">Pill link</a>
        <p>:hover widens and tilts slightly.</p>
      </article>

    </section>
  </main>

  <footer>
    <p>Assignment 8 - Question 9</p>
  </footer>
</body>
</html>
