<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q7 - UI Components</title>
  <link rel="stylesheet" href="q7_ui_components.css">
</head>
<body>
  <header>
    <h1>UI Components</h1>
  </header>

  <main>
    <!-- Card-like container: Flexbox column of components -->
    <section class="card">

      <div class="field">
        <label for="search">Search</label>
        <input type="search" id="search" placeholder="Search anything...">
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option>All categories</option>
          <option>Books</option>
          <option>Movies</option>
          <option>Music</option>
        </select>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary">Search</button>
        <button type="button" class="btn btn-secondary">Reset</button>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 8 - Question 7</p>
  </footer>
</body>
</html>
