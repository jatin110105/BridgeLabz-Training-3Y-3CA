<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Filter Gallery</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header><h1>Responsive Image Filter Gallery</h1></header>
  <main class="gallery">
    <figure><img src="https://picsum.photos/seed/a1/400/300" alt="Blur sample"><figcaption>Blur</figcaption></figure>
    <figure><img src="https://picsum.photos/seed/a2/400/300" alt="Grayscale sample"><figcaption>Grayscale</figcaption></figure>
    <figure><img src="https://picsum.photos/seed/a3/400/300" alt="Sepia sample"><figcaption>Sepia</figcaption></figure>
    <figure><img src="https://picsum.photos/seed/a4/400/300" alt="Brightness sample"><figcaption>Brightness</figcaption></figure>
    <figure><img src="https://picsum.photos/seed/a5/400/300" alt="Contrast sample"><figcaption>Contrast</figcaption></figure>
    <figure><img src="https://picsum.photos/seed/a6/400/300" alt="Hue-rotate sample"><figcaption>Hue-rotate</figcaption></figure>
  </main>
  <footer><p>Hover an image to remove its filter.</p></footer>
</body>
</html>
