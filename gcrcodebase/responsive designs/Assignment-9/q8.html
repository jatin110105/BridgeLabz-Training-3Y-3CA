<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header><h1>Before &amp; After</h1></header>
  <main class="compare">
    <figure>
      <img src="https://picsum.photos/seed/cmp/500/350" alt="Original image">
      <figcaption>Before (original)</figcaption>
    </figure>
    <figure>
      <img class="filtered" src="https://picsum.photos/seed/cmp/500/350" alt="Image with filter">
      <figcaption>After (contrast + brightness)</figcaption>
    </figure>
  </main>
  <footer><p>Hover the right image to fade the filter away.</p></footer>
</body>
</html>
