<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; padding: 0 12px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #aaa; border-radius: 4px; box-sizing: border-box; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; }
    button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
    #message, #output, #ticket { margin-top: 18px; padding: 10px; background: #f3f3f3; border-radius: 4px; white-space: pre-wrap; }
    .success { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Dynamic Object Updater</h2>
  <form id="userForm">
    <label for="name">Name</label>
    <input type="text" id="name">

    <label for="email">Email</label>
    <input type="text" id="email">

    <label for="age">Age</label>
    <input type="number" id="age">

    <button type="submit">Save Changes</button>
  </form>
  <div id="status"></div>
  <h3>Current user object</h3>
  <div id="output"></div>
  <script src="q8_object_updater.js"></script>
</body>
</html>
