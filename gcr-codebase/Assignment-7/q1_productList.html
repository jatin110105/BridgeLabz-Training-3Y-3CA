<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Product List Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-row input { flex: 1; padding: 8px; }
    button { padding: 6px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #ddd; }
    .product-name, .edit-input { flex: 1; }
    .edit-input { padding: 4px; }
    li.editing { background: #fffbe6; }
  </style>
</head>
<body>
  <h2>Product List Manager</h2>
  <div class="add-row">
    <input type="text" id="productInput" placeholder="Enter product name">
    <button id="addBtn">Add</button>
  </div>
  <ul id="productList"></ul>
  <script src="q1_productList.js"></script>
</body>
</html>
