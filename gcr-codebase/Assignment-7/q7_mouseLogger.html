<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 - Mouse Logger</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    #box {
      position: relative; width: 400px; height: 400px;
      border: 2px solid #333; background: #f7f7f7; box-sizing: content-box;
    }
    .dot {
      position: absolute; width: 12px; height: 12px; background: red;
      border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }
    #coords { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Mouse Path & Coordinates Logger</h2>
  <p>Move the mouse inside the box. Double-click to drop a red dot.</p>
  <div id="box"></div>
  <div id="coords">clientX: -, clientY: -</div>
  <script src="q7_mouseLogger.js"></script>
</body>
</html>
